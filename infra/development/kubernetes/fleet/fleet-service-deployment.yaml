apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleet-service
  template:
    metadata:
      labels:
        app: fleet-service
    spec:
      containers:
        - name: fleet-service
          image: routepulse/fleet-service
          ports:
            - containerPort: 9092
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "128Mi"
              cpu: "125m"
          env:
          # - name: BREVO_SMTP_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: routepulse-credentials
          #       key: brevo-smtp-key
          # - name: BREVO_SMTP_FROM
          #   valueFrom:
          #     secretKeyRef:
          #       name: routepulse-credentials
          #       key: brevo-from
          # - name: BREVO_SMTP_HOST
          #   valueFrom:
          #     configMapKeyRef:
          #       name: org-config
          #       key: BREVO_SMTP_HOST
          # - name: BREVO_SMTP_PORT
          #   valueFrom:
          #     configMapKeyRef:
          #       name: org-config
          #       key: BREVO_SMTP_PORT

          - name: FLEET_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: fleet-config
                key: FLEET_SERVICE_ADDR
          - name: FLEET_SERVICE_PORT
            valueFrom:
              configMapKeyRef:
                name: fleet-config
                key: FLEET_SERVICE_PORT
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: routepulse-fleet-credentials
                key: user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: routepulse-fleet-credentials
                key: password
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: routepulse-fleet-credentials
                key: db
          - name: POSTGRES_HOST
            value: postgres-fleet
          - name: POSTGRES_PORT
            value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-service
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: fleet-service
