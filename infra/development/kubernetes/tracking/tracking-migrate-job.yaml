apiVersion: batch/v1
kind: Job
metadata:
  name: tracking-db-migrate
  annotations:
    tilt.dev/restartOnChange: "true"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: routepulse/tracking-migrate
          args:
            - "-dir=/migrations"
            - "postgres"
            - "postgres://$(DB_USER):$(DB_PASSWORD)@postgres-tracking:5432/$(DB_NAME)?sslmode=disable"
            - "up"
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: routepulse-tracking-credentials
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: routepulse-tracking-credentials
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: routepulse-tracking-credentials
                  key: db
