apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organization-service
  template:
    metadata:
      labels:
        app: organization-service
    spec:
      containers:
        - name: organization-service
          image: routepulse/organization-service
          ports:
            - containerPort: 9091
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "128Mi"
              cpu: "125m"
          env:
          # - name: BREVO_SMTP_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: routepulse-credentials
          #       key: brevo-smtp-key
          # - name: BREVO_SMTP_FROM
          #   valueFrom:
          #     secretKeyRef:
          #       name: routepulse-credentials
          #       key: brevo-from
          # - name: BREVO_SMTP_HOST
          #   valueFrom:
          #     configMapKeyRef:
          #       name: org-config
          #       key: BREVO_SMTP_HOST
          # - name: BREVO_SMTP_PORT
          #   valueFrom:
          #     configMapKeyRef:
          #       name: org-config
          #       key: BREVO_SMTP_PORT
          - name: ORGANIZATION_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: org-config
                key: ORGANIZATION_SERVICE_ADDR
          - name: ORGANIZATION_SERVICE_PORT
            valueFrom:
              configMapKeyRef:
                name: org-config
                key: ORGANIZATION_SERVICE_PORT
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: routepulse-org-credentials
                key: user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: routepulse-org-credentials
                key: password
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: routepulse-org-credentials
                key: db
          - name: POSTGRES_HOST
            value: postgres-org
          - name: POSTGRES_PORT
            value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: organization-service
spec:
  type: ClusterIP
  ports:
    - port: 9091
      targetPort: 9091
  selector:
    app: organization-service
