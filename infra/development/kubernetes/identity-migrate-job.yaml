apiVersion: batch/v1
kind: Job
metadata:
  name: identity-db-migrate
  annotations:
    tilt.dev/restartOnChange: "true"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: routepulse/identity-migrate
          args:
            - "-path=/migrations"
            - "-database=postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)?sslmode=disable"
            - "up"
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pg-credentials
                  key: db
