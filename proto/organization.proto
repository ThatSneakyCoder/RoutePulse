syntax = "proto3";

package organization;

option go_package = "shared/proto/organization;organization";

import "google/protobuf/empty.proto";

service OrganizationService {

  rpc CreateOrganization (CreateOrganizationRequest)
    returns (CreateOrganizationResponse);

  rpc GetOrganization (GetOrganizationRequest)
    returns (GetOrganizationResponse);

  rpc ListUserOrganizations (ListUserOrganizationsRequest)
    returns (ListUserOrganizationsResponse);

  rpc ListOrganizationMembers (ListOrganizationMembersRequest)
    returns (ListOrganizationMembersResponse);

  rpc AddMember (AddMemberRequest)
    returns (AddMemberResponse);

  rpc RemoveMember (RemoveMemberRequest)
    returns (RemoveMemberResponse);

  rpc UpdateMemberRole (UpdateMemberRoleRequest)
    returns (UpdateMemberRoleResponse);

  rpc DeactivateOrganization (DeactivateOrganizationRequest)
    returns (google.protobuf.Empty);
}

// --------------------
// Core messages
// --------------------

message Organization {
  string organization_id = 1;
  string name = 2;
  string owner_user_id = 3;
  bool is_active = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message OrganizationMember {
  string user_id = 1;
  string role = 2; // OWNER, ADMIN, MEMBER
  int64 joined_at = 3;
}

message ListOrganizationMembersRequest {
  string organization_id = 1;
}

message ListOrganizationMembersResponse {
  repeated OrganizationMember members = 1;
}

// --------------------
// Requests / Responses
// --------------------

message CreateOrganizationRequest {
  string name = 1;
  string owner_user_id = 2;
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message GetOrganizationRequest {
  string organization_id = 1;
}

message GetOrganizationResponse {
  Organization organization = 1;
  repeated OrganizationMember members = 2;
}

message ListUserOrganizationsRequest {
  string user_id = 1;
}

message ListUserOrganizationsResponse {
  repeated Organization organizations = 1;
}

message AddMemberRequest {
  string organization_id = 1;
  string user_id = 2;
  string role = 3;
}

message AddMemberResponse {
  bool success = 1;
}

message RemoveMemberRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {
  bool success = 1;
}

message UpdateMemberRoleRequest {
  string organization_id = 1;
  string user_id = 2;
  string role = 3;
}

message UpdateMemberRoleResponse {
  bool success = 1;
}

message DeactivateOrganizationRequest {
  string organization_id = 1;
}